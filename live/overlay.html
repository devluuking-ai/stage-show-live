<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · စတိတ်ရှိုး Stage Show</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Serif+Myanmar:wght@600;700&display=swap">
<style>
/* Overlay for TikTok LIVE Studio / OBS window capture. Everything sits on a 1080×1920 stage scaled to the window. */
:root{
  --bg:#08040f; --fg:#fdf6ff; --muted:#cdbcf0; --gold:#ffd23f; --gold2:#ffe27a; --pink:#ff2e88; --red:#a1124a;
  --panel:rgba(20,8,34,.80); --line:rgba(255,120,190,.55);
  --display:"Noto Serif Myanmar","Noto Sans Myanmar",serif; --body:"Noto Sans Myanmar","Pyidaungsu",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:1080px;height:1920px}
.ui{position:absolute;z-index:3}
/* title plaque */
#plaque{left:90px;right:90px;top:56px;display:flex;flex-direction:column;align-items:center;gap:14px}
#title{position:relative;box-sizing:border-box;max-width:100%;border:3px solid var(--gold);border-radius:28px;padding:20px 96px;
  background:linear-gradient(180deg,rgba(84,16,64,.92),rgba(24,8,44,.92));box-shadow:0 0 0 6px rgba(0,0,0,.35),0 0 50px rgba(255,46,136,.30) inset;
  font-family:var(--display);font-weight:700;font-size:52px;line-height:1.3;letter-spacing:.06em;color:var(--gold2);text-transform:uppercase;text-align:center;text-shadow:0 2px 0 #2a0a3a,0 0 22px rgba(255,46,136,.5)}
#title::before,#title::after{content:"✦";position:absolute;top:50%;transform:translateY(-50%);font-size:44px;color:var(--gold)}
#title::before{left:34px}#title::after{right:34px}
#subtitle{box-sizing:border-box;max-width:100%;border:2px solid var(--line);border-radius:999px;padding:10px 34px;background:var(--panel);
  font-family:var(--display);font-size:29px;line-height:1.3;letter-spacing:.12em;color:var(--fg);text-align:center}
/* pills */
#pills{top:296px;left:0;right:0;display:flex;justify-content:center;gap:26px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:12px 28px;font-size:34px;font-weight:600;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.pill small{font-size:20px;font-weight:500;color:var(--muted);line-height:1.05}
.dot{width:18px;height:18px;border-radius:50%;background:#46d36b;box-shadow:0 0 12px #46d36b}
/* side cards */
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 22px;font-size:25px;line-height:1.4;backdrop-filter:blur(4px)}
#guide{left:24px;top:630px;width:290px}
#guide div+div{border-top:1px solid rgba(255,120,190,.3);margin-top:10px;padding-top:10px}
#guide b{color:var(--gold2)}
#merit{right:24px;top:630px;width:290px;text-align:center}
#merit h3{margin:0 0 8px;font-family:var(--display);font-size:30px;color:var(--gold2);letter-spacing:.06em}
#merit ol{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:6px}
#merit li{display:flex;justify-content:space-between;gap:10px}
#merit li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#merit li span:last-child{color:var(--gold2);font-variant-numeric:tabular-nums}
#merit .empty{color:var(--muted);text-align:center}
/* chant banner + gift banner */
#chant{left:110px;right:110px;top:330px;padding:22px 30px;text-align:center;border-radius:24px;border:2px solid var(--gold);
  background:rgba(30,10,48,.88);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
#chant.show{opacity:1;transform:none}
#chant h4{margin:0 0 8px;font-family:var(--display);color:var(--gold2);font-size:30px;letter-spacing:.1em}
#chant p{margin:0;font-family:var(--display);font-style:italic;font-size:30px;line-height:1.45}
#gift{left:70px;right:70px;top:330px;z-index:5;padding:30px 40px;text-align:center;border-radius:28px;border:3px solid var(--gold2);
  background:radial-gradient(ellipse at 50% 0%,rgba(190,24,110,.95),rgba(40,10,60,.95));box-shadow:0 0 60px rgba(255,46,136,.5);
  opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#gift.show{opacity:1;transform:none}
#gift .who{font-family:var(--display);font-weight:700;font-size:52px;color:var(--gold2)}
#gift .what{font-size:36px;margin-top:6px}
#gift .pray{font-family:var(--display);font-style:italic;font-size:32px;color:var(--fg);margin-top:12px;opacity:.95}
/* enable sound (needed once: browsers block autoplay) */
#unmute{position:absolute;z-index:9;left:50%;top:1540px;transform:translateX(-50%);font:600 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--gold2);background:linear-gradient(135deg,#ff2e88,#7c3aed);color:#fff;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.6}
@media (prefers-reduced-motion:reduce){#chant,#gift{transition:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><div id="title">စတိတ်ရှိုး Stage Show</div><div id="subtitle">ကြိုဆိုပါတယ် · အားပေးကြပါ 🎤</div></div>
  <div id="pills" class="ui">
    <div class="pill"><span class="dot"></span><span id="count">0/24</span><small>ပွဲကြည့်<br>နေသူ</small></div>
    <div class="pill">⏱ <span id="timer">00:00:00</span></div>
  </div>
  <div id="guide" class="card ui">
    <div>💬 <b>Comment တစ်ခုခု</b> ရေးပြီး ပွဲထဲ ဝင်ပါ</div>
    <div>အရုပ်ပြောင်းချင်ရင် <b>ယောက်ျား · မိန်းကလေး · အဘွား · ကလေး</b> လို့ ရေးပါ</div>
    <div>🎁 Gift ပို့ရင် <b>နာမည်ကို အသံနဲ့ ခေါ်ပေးပါတယ်</b></div>
  </div>
  <div id="merit" class="card ui"><h3>✦ Top ပံ့ပိုးသူ ✦</h3><ol id="meritList"><li class="empty">မရှိသေးပါ</li></ol></div>
  <div id="chant" class="ui"><h4>✦ ကြေညာချက် ✦</h4><p id="chantText"></p></div>
  <div id="gift" class="ui"><div class="who" id="giftWho"></div><div class="what" id="giftWhat"></div><div class="pray" id="giftPray"></div></div>
  <button id="unmute">🔔 အသံဖွင့်ရန် နှိပ်ပါ</button>
  <div id="conn">ချိတ်ဆက်နေသည်…</div>
</div></div>

<script>
/* ======================= stage fit ======================= */
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

/* ======================= assets ======================= */
const A = {};
const IMG = { hall:'/assets/hall.jpg', monk:'/assets/c_monk.png', nun:'/assets/c_nun.png', granny:'/assets/c_granny.png', man:'/assets/c_man.png', man_down:'/assets/c_man_down.png',
  woman:'/assets/c_woman.png', woman_down:'/assets/c_woman_down.png', child:'/assets/c_child.png', performer_female:'/assets/performer_female.png', performer_female_stand:'/assets/performer_female_stand.png', performer_female_one:'/assets/performer_female_one.png', performer_female_two:'/assets/performer_female_two.png', performer_female_wave:'/assets/performer_female_wave.png', performer_male:'/assets/performer_male.png', performer_male_stand:'/assets/performer_male_stand.png', performer_male_one:'/assets/performer_male_one.png', performer_male_two:'/assets/performer_male_two.png', performer_male_wave:'/assets/performer_male_wave.png', anim_man:'/assets/anim_man.png', anim_woman:'/assets/anim_woman.png', anim_granny:'/assets/anim_granny.png', front_singer:'/assets/front_singer.png', front_woman:'/assets/front_woman.png', };
for (const [k,src] of Object.entries(IMG)){ const im=new Image(); im.src=src; A[k]=im; }
const ANIM = { man:{fw:212,fh:300,seatH:252}, woman:{fw:212,fh:300,seatH:220}, granny:{fw:195,fh:300,seatH:222} };
const hasAnim = k => ANIM[k] && A['anim_'+k]?.naturalWidth > 0;
const avatars = new Map();
function avatar(url){ if(!url) return null; let im=avatars.get(url); if(!im){ im=new Image(); im.referrerPolicy='no-referrer'; im.src=url; avatars.set(url,im); } return im.naturalWidth?im:null; }

/* ======================= seats ======================= */
// Floor trapezoid in front of the stage: back row just below the stage, front row near the bottom.
const FLOOR = { yTop: 1410, yBot: 1790, halfTop: 440, halfBot: 250 };   // Myanmar neon stage: the audience sits only on the bright blue floor mat   // neon iso stage: floor narrows toward the bottom-centre channel between the corner platforms
const GRID = { 24:[6,4], 36:[6,6], 64:[8,8], 100:[10,10] };
let cap = 24, seats = [];
function layout(c){
  cap = c; const [cols, rows] = GRID[c] || GRID[24]; seats = [];
  for (let r=0;r<rows;r++){
    const t = rows===1 ? .5 : r/(rows-1);                     // 0 = back row
    const y = FLOOR.yTop + (FLOOR.yBot-FLOOR.yTop)*t;
    const half = FLOOR.halfTop + (FLOOR.halfBot-FLOOR.halfTop)*t;
    const scale = .60 * (6/cols) ** .75;   // uniform crowd: everyone the award-giver's size, standing on the blue floor (no chairs, no perspective shrink)
    const gap = 2*half/(cols-1) * .93;                        // room for one name tag
    for (let k=0;k<cols;k++){
      let u = (k-(cols-1)/2)/((cols-1)/2); u = Math.sign(u)*(.14 + .86*Math.abs(u));   // open a centre aisle
      seats.push({ x: 540 + u*half, y, scale, r, k, rows, gap });
    }
  }
  // fill front rows first, aisle side first, so a small crowd still looks full on camera
  seats.sort((a,b)=> (b.r-a.r) || (Math.abs(a.x-540)-Math.abs(b.x-540)));
  reseat();
}
const visitors = new Map();  // id -> visitor
let order = [];               // ids in seating order
function reseat(){
  order = order.filter(id => visitors.has(id));
  order.forEach((id,i) => { const v = visitors.get(id), s = seats[i]; if (!v || !s) return; v.seat = s; if (v.state==='sit') { v.tx = s.x; v.ty = s.y; } });
}
document.getElementById('count').textContent = '0/24';

/* the performer fixed on stage (gold tag + spotlight ring behind) */
const TEACHERS = [ { name:'🎤 အဆိုတော်', skin:'performer', x:495, y:950, s:.66, master:true } ];

function addVisitor(p, instant){
  let _h=0; const _nm=String(p.name||p.id||''); for (let i=0;i<_nm.length;i++) _h=(_h*31+_nm.charCodeAt(i))>>>0;
  p = { ...p, skin: (p.skin==='man'||p.skin==='woman') ? p.skin : (_h%2 ? 'woman' : 'man') };   // control/server-chosen gender wins; otherwise man + woman by name
  if (visitors.has(p.id)) { Object.assign(visitors.get(p.id), { name:p.name, skin:p.skin, avatar:p.avatar, coins:p.coins }); return; }
  const v = { ...p, state:'walk', x:540, y:2020, tx:0, ty:0, frame:0, ft:0, sitT:0, flip:false, fade:0, bubble:null, glow:0, bow:0, phase:Math.random()*6.28, armA:Math.random(), armS:.6+Math.random()*.9, wanderT:2+Math.random()*6, moving:false, wx:0, wy:0, settle:0, dPh1:Math.random()*6.28, dPh2:Math.random()*6.28, dAx:14+Math.random()*16, dAy:8+Math.random()*10, dFx:.05+Math.random()*.05, dFy:.04+Math.random()*.05 };
  visitors.set(p.id, v); order.push(p.id); reseat();
  if (instant || !v.seat){ v.state='sit'; v.frame=7; v.x=v.tx=v.seat?.x||540; v.y=v.ty=v.seat?.y||1500; v.fade = instant?1:0; }
}
function removeVisitor(id){ visitors.delete(id); reseat(); }
/* crown-gift award walk: the giver climbs the front stairs to the singer, the award shows and auto-hides, he comes back down front-facing and returns to his seat cheering */
function startAward(v){ awardBusy=true; awardSince=performance.now(); v.state='award'; v.aw={ ph:'up1', t:0, frame:0, ft:0 }; }
const awardScale=y=>{ const cols=(GRID[cap]||GRID[24])[0]; const fl=.60*(6/cols)**.75*1.05*260/252; if (y>=FLOOR.yTop) return fl; const k=Math.max(0,Math.min(1,(y-950)/(FLOOR.yTop-950))); return .68+(fl-.68)*k; };   // on the floor he is exactly the crowd's uniform size

/* ======================= HUD ======================= */
let startedAt = Date.now();
function updateCount(){ document.getElementById('count').textContent = `${visitors.size}/${cap}`; }
function renderMerit(){
  const top = [...visitors.values()].filter(v=>v.coins>0).sort((a,b)=>b.coins-a.coins).slice(0,5);
  const ol = document.getElementById('meritList'); ol.innerHTML='';
  if (!top.length){ ol.innerHTML='<li class="empty">မရှိသေးပါ</li>'; return; }
  top.forEach((v,i)=>{ const li=document.createElement('li'); const a=document.createElement('span'); a.textContent=`${i+1}. ${v.name}`; const b=document.createElement('span'); b.textContent=v.coins; li.append(a,b); ol.append(li); });
}
setInterval(()=>{ const s=Math.floor((Date.now()-startedAt)/1000); document.getElementById('timer').textContent=[s/3600,s/60%60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':'); },1000);
let giftHide=null;
let awardBusy=false, awardSince=0;   // a giver award walk is in progress
const awardQueue=[];   // crown givers waiting for their award walk (starts once they are seated)
function showGift(m){
  document.getElementById('giftWho').textContent = m.name;
  document.getElementById('giftWhat').textContent = `${m.giftName}${m.count>1?' ×'+m.count:''} ပို့ပြီး အားပေးတယ် · စုစုပေါင်း ${m.total} ✦`;
  document.getElementById('giftPray').textContent = '“' + m.prayer + '”';
  document.getElementById('chant').classList.remove('show');
  const el=document.getElementById('gift'); el.classList.add('show'); clearTimeout(giftHide); giftHide=setTimeout(()=>el.classList.remove('show'), m.tier>=3?9000:6500);
}
let chantHide=null;
function showChant(text){ document.getElementById('chantText').textContent=text; const el=document.getElementById('chant'); el.classList.add('show'); clearTimeout(chantHide); chantHide=setTimeout(()=>el.classList.remove('show'), 14000); }

/* ======================= audio ======================= */
let AC=null, master=null, musicGain=null, sfx=null, settings={ music:true, mo:false, moBpm:52, performer:'female', track:1 };
const TRACKS=['/assets/music/music1.mp3','/assets/music/music2.mp3','/assets/music/custom.mp3']; let trackIdx=0, musicEl=null;
document.getElementById('unmute').onclick = e => { e.currentTarget.remove(); startAudio(); };
function startAudio(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=.9;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=24; comp.ratio.value=5; comp.attack.value=.004; comp.release.value=.24;
  master.connect(comp); comp.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value=settings.music?.5:0; musicGain.connect(master);
  sfx = AC.createGain(); sfx.gain.value=1; sfx.connect(master);
  nextTrack(); scheduleMo(); bell();
  playIntro();
}
function playIntro(){   // welcome announcement: plays when the show starts, music ducks under it
  if (!AC) return;
  const el = new Audio('/assets/intro.mp3'); const src = AC.createMediaElementSource(el); const g = AC.createGain(); g.gain.value = 1.15; src.connect(g); g.connect(master);
  el.onplay = () => duck(true); el.onended = el.onerror = () => duck(false);
  el.play().catch(()=>{});
}
function nextTrack(){
  if (musicEl){ musicEl.pause(); }
  musicEl = new Audio(TRACKS[trackIdx++ % TRACKS.length]); const src=AC.createMediaElementSource(musicEl); src.connect(musicGain);
  musicEl.onended = nextTrack; musicEl.onerror = () => setTimeout(nextTrack, 800); musicEl.play().catch(()=>{});
}
function duck(on){ if(!musicGain) return; const t=AC.currentTime, target = !settings.music ? 0 : on ? .14 : .5; musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value,t); musicGain.gain.linearRampToValueAtTime(target,t+1.1); }
let haloPulse=0;
function bell(big){   // stage chime + spotlight pulse (name kept: server sends 'bell')
  if(!AC) return; const t=AC.currentTime, k=big?1.7:1;
  for (const [f,a,d] of [[523.25,.42,4],[1046.5,.2,3],[1567.98,.09,2]]) { const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f*(big?.75:1); const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*k*.7,t+.015); g.gain.exponentialRampToValueAtTime(.0005,t+d*k); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+d*k+.1); }
  haloPulse=1;
}
function mo(){   // stage beat thump (name kept: server/setting key is 'mo')
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(52,t+.11);
  const g=AC.createGain(); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.13);
  o.connect(g); g.connect(sfx); o.start(t); o.stop(t+.14);
}
let moTimer=null; function scheduleMo(){ clearInterval(moTimer); if (AC && settings.mo) moTimer=setInterval(mo, 60000/Math.max(20,settings.moBpm||52)); }
// server-made voice lines play one after another
const ttsQ=[]; let ttsPlaying=false;
function queueTTS(url, onStart){ ttsQ.push({url,onStart}); playTTS(); }
function playTTS(){
  if (ttsPlaying || !ttsQ.length || !AC) return; ttsPlaying=true;
  const {url,onStart}=ttsQ.shift(); const el=new Audio(url); const src=AC.createMediaElementSource(el); const g=AC.createGain(); g.gain.value=1.25; src.connect(g); g.connect(master);
  el.onplay=()=>{ duck(true); onStart&&onStart(); }; el.onended=el.onerror=()=>{ duck(false); ttsPlaying=false; setTimeout(playTTS,350); };
  el.play().catch(()=>{ ttsPlaying=false; });
}

/* ======================= effects ======================= */
const fx=[], petals=[];
function giftFx(v, tier){
  v.glow=1; v.bow=1;
  const kind = 'spark', s=v.seat?.scale||.4;
  fx.push({kind, x:v.x, y:v.y-220*s, t:0, life: tier>=3?3.4:2.4, scale: s*(tier>=3?1.5:1.1)});
  for (let i=0;i<(tier>=3?22:tier>=2?10:4);i++) petals.push({x:v.x+(Math.random()-.5)*120, y:v.y-80, vx:(Math.random()-.5)*40, vy:-(70+Math.random()*90), t:0, life:2.6+Math.random(), s:.16+Math.random()*.14});
  if (tier>=3){ bell(true); for (let i=0;i<30;i++) petals.push({x:540+(Math.random()-.5)*600, y:300+Math.random()*250, vx:(Math.random()-.5)*40, vy:30+Math.random()*50, t:0, life:5, s:.2+Math.random()*.15}); }
}
function hearts(v,n){ for (let i=0;i<Math.min(6,n);i++) petals.push({x:v.x+(Math.random()-.5)*60, y:v.y-140*(v.seat?.scale||.4), vx:(Math.random()-.5)*20, vy:-(50+Math.random()*40), t:0, life:1.6, s:.08, heart:true}); }

/* ======================= server link ======================= */
let ws=null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=document.getElementById('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent='server နဲ့ ပြတ်သွားတယ်… ပြန်ချိတ်နေတယ်'; setTimeout(connect,2000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.t){
      case 'state':
        Object.assign(settings,m.settings); applySettings(); startedAt=m.startedAt;
        visitors.clear(); order=[]; layout(m.cap); for (const p of m.viewers) addVisitor(p,true); updateCount(); renderMerit(); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); if (m.cap!==cap){ layout(m.cap); updateCount(); } break;
      case 'join': if (m.cap!==cap) layout(m.cap); addVisitor(m.v, m.v.demo && visitors.size>8); updateCount(); break;
      case 'leave': { const lv=visitors.get(m.id); if (lv && lv.state==='award') awardBusy=false; removeVisitor(m.id); updateCount(); renderMerit(); } break;
      case 'skin': { const v=visitors.get(m.id); if(v){ if(m.skin==='woman'||m.skin==='man') v.skin=m.skin; v.glow=.8; if(v.state!=='sit'){ v.state='sit'; v.frame=7; } } } break;
      case 'chat': { const v=visitors.get(m.id); if(v){ v.bubble={text:m.text, until:performance.now()+6000}; v.bow=.6; } } break;
      case 'gift': { const v=visitors.get(m.id); if(v){ v.coins=m.total; giftFx(v,m.tier); } renderMerit(); showGift(m); if (m.tier>=3 && v && !awardQueue.includes(m.id)) awardQueue.push(m.id); } break;
      case 'like': { const v=visitors.get(m.id); if(v) hearts(v,m.n); } break;
      case 'tts': queueTTS(m.url); break;
      case 'chant': showChant(m.text); bell(); break;
